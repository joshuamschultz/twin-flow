[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinflow"
version = "0.3.0a1"
description = "Agent-first operational twins for manufacturing, office workflows and supply networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Joshua Schultz" }]
dependencies = [
    "simpy>=4,<5",
    "numpy>=2",
    "polars>=1",
    "scipy>=1.11",
    "pyyaml>=6",
    "simpleeval>=1.0.5",
    "plotly>=5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# The optional service surface (twinflow.service): a local REST API the React
# front end drives. The core engine never imports it, so a plain install stays
# dependency-light; `pip install -e ".[api]"` adds it.
api = ["fastapi>=0.110", "uvicorn>=0.29"]
agent = ["mcp>=2,<3"]
scheduling = ["ortools>=9.10,<10"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.8",
    "pip-audit>=2.7",
    "types-PyYAML>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
twinflow = "twinflow.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twinflow = ["report/_assets/*.js", "report/_assets/*.png", "scenario/schema.json"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S307 (eval), S102 (exec) stay ON everywhere: the no-eval/no-exec rule (D-001/D-002).
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is expected in tests

[tool.mypy]
# numpy 2.x type stubs use PEP 695 `type` statements that mypy only parses
# under python_version >= 3.12. Runtime floor stays >=3.11 (tech.md); the
# static-analysis target is 3.12. Bumping this is a toolchain choice, not a
# runtime one.
python_version = "3.12"
strict = true
files = ["src"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

# simpleeval ships no py.typed marker; the sandbox wrapper (model/expressions.py) adds the
# types at its own boundary. Silence only the missing-stub error for this one dependency.
[[tool.mypy.overrides]]
module = ["simpleeval"]
ignore_missing_imports = true

# gymnasium is an optional integration dependency: `twinflow.adapters.rl` exposes a
# Gymnasium-style env and only imports gymnasium inside `to_gymnasium()`, so a plain
# install never needs it. Silence the missing-stub error for the optional import.
[[tool.mypy.overrides]]
module = ["gymnasium", "gymnasium.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
