<text x="427.7" y="211.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2128" text-anchor="start" font-weight="600"><tspan x="427.7" y="211.0">Discrete time (step)</tspan></text>
<text x="427.7" y="233.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5d6670" text-anchor="start"><tspan x="427.7" y="233.5">The plant moves one shift or day at a time.</tspan><tspan x="427.7" dy="18.2">Simple and fast.</tspan></text>
