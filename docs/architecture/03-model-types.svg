<text x="47.0" y="324.1" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2128" text-anchor="start" font-weight="600"><tspan x="47.0" y="324.1">Markov decision process (MDP)</tspan></text>
