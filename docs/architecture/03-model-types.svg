<text x="808.3" y="324.1" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2128" text-anchor="start" font-weight="600"><tspan x="808.3" y="324.1">Continuous flow</tspan></text>
<text x="808.3" y="346.6" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5d6670" text-anchor="start"><tspan x="808.3" y="346.6">Material moves as rates, like water in pipes.</tspan><tspan x="808.3" dy="18.2">Use for fast big-picture what-ifs.</tspan></text>
