<text x="427.7" y="324.1" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2128" text-anchor="start" font-weight="600"><tspan x="427.7" y="324.1">Hidden Markov</tspan></text>
<text x="427.7" y="346.6" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5d6670" text-anchor="start"><tspan x="427.7" y="346.6">The true state is hidden, for example machine</tspan><tspan x="427.7" dy="18.2">wear. It is estimated from signals such as</tspan><tspan x="427.7" dy="18.2">scrap and cycle time.</tspan></text>
