<text x="808.3" y="211.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#1b2128" text-anchor="start" font-weight="600"><tspan x="808.3" y="211.0">Markov chain</tspan></text>
