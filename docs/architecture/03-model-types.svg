<text x="36.0" y="88.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="32" fill="#1b2128" text-anchor="start" font-weight="600"><tspan x="36.0" y="88.0">Model types</tspan></text>
<text x="36.0" y="118.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#5d6670" text-anchor="start"><tspan x="36.0" y="118.0">Each model is a different way to run the same twin. Every model writes the same state record.</tspan></text>
