<text x="60.0" y="919.1" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#1b2128" text-anchor="start"><tspan x="60.0" y="919.1">How the Markov models fit together: the step model runs the plant. The Markov chain is measured from the moves it records. Add decisions</tspan><tspan x="60.0" dy="20.0">and dollars and you get the MDP, which RL learns from. A hidden Markov model guesses states you cannot see.</tspan></text>
