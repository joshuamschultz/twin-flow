<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="728" viewBox="0 0 1200 728" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<title>Twinflow: twin types</title>
<rect x="0" y="0" width="1200" height="728" fill="#f6f8fb"/>
<text x="36.0" y="46.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#0055bc" text-anchor="start" letter-spacing="1"><tspan x="36.0" y="46.0">twinflow · proposed architecture · draft</tspan></text>
<text x="36.0" y="88.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="32" fill="#0b1220" text-anchor="start" font-weight="600"><tspan x="36.0" y="88.0">Twin types</tspan></text>
<text x="36.0" y="118.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#54585c" text-anchor="start"><tspan x="36.0" y="118.0">A twin is a copy of something real. Pick it by what it copies and how close to live data it runs.</tspan></text>
