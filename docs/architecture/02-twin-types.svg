<text x="908.5" y="606.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#0b1220" text-anchor="start" font-weight="600"><tspan x="908.5" y="606.0">Advisor</tspan></text>
<text x="908.5" y="630.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#54585c" text-anchor="start"><tspan x="908.5" y="630.0">Recommends the next action. A</tspan><tspan x="908.5" dy="18.0">person approves it.</tspan></text>
