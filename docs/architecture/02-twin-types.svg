<text x="1038.0" y="209.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" fill="#54585c" text-anchor="start"><tspan x="1038.0" y="209.0">STATUS</tspan></text>
<line x1="36.0" y1="222.0" x2="1164.0" y2="222.0" stroke="#dfe3e8" stroke-width="1" fill="none"/>
<text x="48.0" y="247.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0b1220" text-anchor="start" font-weight="600"><tspan x="48.0" y="247.5">Machine twin</tspan></text>
<text x="208.0" y="247.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="208.0" y="247.5">One asset: a press, a mill,</tspan><tspan x="208.0" dy="19.0">an oven</tspan></text>
<text x="458.0" y="247.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="458.0" y="247.5">When will it fail? How fast can it</tspan><tspan x="458.0" dy="19.0">run?</tspan></text>
<text x="748.0" y="247.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="748.0" y="247.5">Hidden Markov, Markov chain,</tspan><tspan x="748.0" dy="19.0">statistics</tspan></text>
<rect x="1038.0" y="233.0" width="33.5" height="18.0" rx="4" fill="#d5f6fb"/>
<text x="1054.8" y="245.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#0b6b7a" text-anchor="middle" font-weight="600"><tspan x="1054.8" y="245.8">New</tspan></text>
<line x1="36.0" y1="282.0" x2="1164.0" y2="282.0" stroke="#dfe3e8" stroke-width="1" fill="none"/>
<text x="48.0" y="307.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0b1220" text-anchor="start" font-weight="600"><tspan x="48.0" y="307.5">Line twin</tspan></text>
<text x="208.0" y="307.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="208.0" y="307.5">A cell or line of machines</tspan><tspan x="208.0" dy="19.0">and people</tspan></text>
<text x="458.0" y="307.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="458.0" y="307.5">Where does it choke? What batch</tspan><tspan x="458.0" dy="19.0">size?</tspan></text>
<text x="748.0" y="307.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="748.0" y="307.5">Discrete event, queueing</tspan></text>
<rect x="1038.0" y="293.0" width="40.0" height="18.0" rx="4" fill="#d6e6ff"/>
