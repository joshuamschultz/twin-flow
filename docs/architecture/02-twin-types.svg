<text x="623.0" y="630.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#54585c" text-anchor="start"><tspan x="623.0" y="630.0">Starts from "the plant right</tspan><tspan x="623.0" dy="18.0">now" and looks ahead to dates</tspan><tspan x="623.0" dy="18.0">and risks.</tspan></text>
