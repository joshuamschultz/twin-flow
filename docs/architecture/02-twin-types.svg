<text x="52.0" y="578.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" fill="#0055bc" text-anchor="start" letter-spacing="1"><tspan x="52.0" y="578.0">MODE</tspan></text>
<text x="52.0" y="606.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#0b1220" text-anchor="start" font-weight="600"><tspan x="52.0" y="606.0">Design</tspan></text>
<text x="52.0" y="630.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#54585c" text-anchor="start"><tspan x="52.0" y="630.0">No live data. Test a plant or</tspan><tspan x="52.0" dy="18.0">change before you build it.</tspan></text>
<rect x="321.5" y="550.0" width="271.5" height="138.0" rx="8" fill="#ffffff" stroke="#dfe3e8" stroke-width="1"/>
<text x="337.5" y="578.0" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" fill="#0055bc" text-anchor="start" letter-spacing="1"><tspan x="337.5" y="578.0">MODE</tspan></text>
<text x="337.5" y="606.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#0b1220" text-anchor="start" font-weight="600"><tspan x="337.5" y="606.0">Shadow</tspan></text>
<text x="337.5" y="630.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#54585c" text-anchor="start"><tspan x="337.5" y="630.0">Follows real data. Shows where</tspan><tspan x="337.5" dy="18.0">the model and the plant differ.</tspan></text>
