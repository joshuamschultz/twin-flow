<line x1="36.0" y1="342.0" x2="1164.0" y2="342.0" stroke="#dfe3e8" stroke-width="1" fill="none"/>
<text x="48.0" y="367.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0b1220" text-anchor="start" font-weight="600"><tspan x="48.0" y="367.5">Factory twin</tspan></text>
<text x="208.0" y="367.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="208.0" y="367.5">The whole plant: orders,</tspan><tspan x="208.0" dy="19.0">stock, staff, setups</tspan></text>
<text x="458.0" y="367.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="458.0" y="367.5">Can we hit these dates? Which</tspan><tspan x="458.0" dy="19.0">policy wins?</tspan></text>
<text x="748.0" y="367.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="748.0" y="367.5">Discrete event, MDP, schedule</tspan></text>
<rect x="1038.0" y="353.0" width="53.1" height="18.0" rx="4" fill="#fdf1e4"/>
<text x="1064.5" y="365.8" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#8a4c11" text-anchor="middle" font-weight="600"><tspan x="1064.5" y="365.8">Extend</tspan></text>
<line x1="36.0" y1="402.0" x2="1164.0" y2="402.0" stroke="#dfe3e8" stroke-width="1" fill="none"/>
<text x="48.0" y="427.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0b1220" text-anchor="start" font-weight="600"><tspan x="48.0" y="427.5">Supply network</tspan><tspan x="48.0" dy="19.0">twin</tspan></text>
<text x="208.0" y="427.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="208.0" y="427.5">Plants, warehouses,</tspan><tspan x="208.0" dy="19.0">suppliers, customers</tspan></text>
<text x="458.0" y="427.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="458.0" y="427.5">Where should stock sit? What if a</tspan><tspan x="458.0" dy="19.0">supplier is late?</tspan></text>
<text x="748.0" y="427.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="748.0" y="427.5">MDP, continuous flow, discrete</tspan><tspan x="748.0" dy="19.0">event</tspan></text>
<rect x="1038.0" y="413.0" width="53.1" height="18.0" rx="4" fill="#fdf1e4"/>
