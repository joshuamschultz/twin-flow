<line x1="36.0" y1="462.0" x2="1164.0" y2="462.0" stroke="#dfe3e8" stroke-width="1" fill="none"/>
<text x="48.0" y="487.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#0b1220" text-anchor="start" font-weight="600"><tspan x="48.0" y="487.5">Office twin</tspan></text>
<text x="208.0" y="487.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="208.0" y="487.5">Quotes, approvals,</tspan><tspan x="208.0" dy="19.0">engineering, order entry</tspan></text>
<text x="458.0" y="487.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="458.0" y="487.5">How long does a quote take? Who is</tspan><tspan x="458.0" dy="19.0">overloaded?</tspan></text>
<text x="748.0" y="487.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" fill="#54585c" text-anchor="start"><tspan x="748.0" y="487.5">Discrete event, Markov chain</tspan></text>
