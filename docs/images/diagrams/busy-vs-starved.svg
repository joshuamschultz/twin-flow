<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 404" width="800" height="404" role="img" aria-labelledby="title desc">
  <title id="title">Busy and starved, by work center</title>
  <desc id="desc">Four work centers. mill_VB, the bottleneck, is busy 95 percent of the time and starved 0.9 days of 18. lathe_FTG is busy 25 percent and starved 13.8 days. mill_MB is busy 24 percent and starved 14.0 days. deburr_VB is busy 14 percent and starved 15.8 days. No center is blocked.</desc>
  <style>
    .bg { fill: #f6f8fb; stroke: #dfe3e8; stroke-width: 1; }
    .card { fill: #ffffff; stroke: #c7d6e8; stroke-width: 1.5; }
    .tint { fill: #eef4ff; stroke: #9cc2ff; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0073fe; stroke-width: 2; }
    .later { fill: #ffffff; stroke: #8fa6c4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .warn { fill: #f68d2e; fill-opacity: 0.1; stroke: #f68d2e; stroke-width: 1.5; }
    .h { font-family: 'Space Grotesk', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #002550; letter-spacing: -0.3px; }
    .sub { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #54585c; }
    .t { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #002550; }
    .b { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #243042; }
    .m { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #54585c; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; fill: #003b82; }
    .num { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; fill: #243042; }
    .good { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0055bc; }
    .bad { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #8a4c11; }
    .line { stroke: #0055bc; stroke-width: 1.5; fill: none; }
    .tree { stroke: #8fa6c4; stroke-width: 1.5; fill: none; }
    .axis { stroke: #8fa6c4; stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0055bc"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="799" height="403" rx="4"/>

  <text class="h" x="36" y="44">Busy and starved, by work center</text>
  <text class="sub" x="36" y="66">The bottleneck is the busy center that never waits. The others wait for it.</text>
  <text class="m" x="190" y="104">Busy (% of the time)</text>
  <text class="m" x="460" y="104">Starved (days of 18)</text>
  <text class="m" x="690" y="104">Blocked (days)</text>
  <rect class="warn" x="36" y="118" width="728" height="46" rx="4"/>
  <text class="code" x="52" y="138" style="font-weight: 700">mill_VB</text>
  <text class="bad" x="52" y="155" style="font-size: 12px">bottleneck</text>
  <rect x="190" y="137" width="200" height="8" rx="1" fill="#eef4ff"/>
  <rect x="190" y="137" width="190" height="8" rx="1" fill="#f68d2e"/>
  <text class="num" x="398" y="146" style="font-weight: 700">95%</text>
  <rect x="460" y="137" width="180" height="8" rx="1" fill="#eef4ff"/>
  <rect x="460" y="137" width="9" height="8" rx="1" fill="#9cc2ff"/>
  <text class="num" x="648" y="146" style="font-weight: 700">0.9</text>
  <text class="num" x="690" y="146">0.0</text>
  <rect class="card" x="36" y="174" width="728" height="46" rx="4"/>
  <text class="code" x="52" y="202" style="font-weight: 700">lathe_FTG</text>
  <rect x="190" y="193" width="200" height="8" rx="1" fill="#eef4ff"/>
  <rect x="190" y="193" width="50" height="8" rx="1" fill="#9cc2ff"/>
  <text class="num" x="398" y="202" style="font-weight: 500">25%</text>
  <rect x="460" y="193" width="180" height="8" rx="1" fill="#eef4ff"/>
  <rect x="460" y="193" width="138" height="8" rx="1" fill="#9cc2ff"/>
  <text class="num" x="648" y="202" style="font-weight: 500">13.8</text>
  <text class="num" x="690" y="202">0.0</text>
  <rect class="card" x="36" y="230" width="728" height="46" rx="4"/>
  <text class="code" x="52" y="258" style="font-weight: 700">mill_MB</text>
  <rect x="190" y="249" width="200" height="8" rx="1" fill="#eef4ff"/>
  <rect x="190" y="249" width="48" height="8" rx="1" fill="#9cc2ff"/>
  <text class="num" x="398" y="258" style="font-weight: 500">24%</text>
  <rect x="460" y="249" width="180" height="8" rx="1" fill="#eef4ff"/>
  <rect x="460" y="249" width="140" height="8" rx="1" fill="#9cc2ff"/>
  <text class="num" x="648" y="258" style="font-weight: 500">14.0</text>
  <text class="num" x="690" y="258">0.0</text>
  <rect class="card" x="36" y="286" width="728" height="46" rx="4"/>
  <text class="code" x="52" y="314" style="font-weight: 700">deburr_VB</text>
  <rect x="190" y="305" width="200" height="8" rx="1" fill="#eef4ff"/>
  <rect x="190" y="305" width="28" height="8" rx="1" fill="#9cc2ff"/>
  <text class="num" x="398" y="314" style="font-weight: 500">14%</text>
  <rect x="460" y="305" width="180" height="8" rx="1" fill="#eef4ff"/>
  <rect x="460" y="305" width="158" height="8" rx="1" fill="#9cc2ff"/>
  <text class="num" x="648" y="314" style="font-weight: 500">15.8</text>
  <text class="num" x="690" y="314">0.0</text>
  <text class="m" x="36" y="364">The bottleneck is busy and almost never starved. The machines after it wait for it.</text>
  <text class="m" x="36" y="384">Numbers are from the first run. No center is blocked.</text>
</svg>
