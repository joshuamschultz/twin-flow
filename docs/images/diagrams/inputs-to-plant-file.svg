<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 458" width="800" height="458" role="img" aria-labelledby="title desc">
  <title id="title">How your numbers flow into the plant file</title>
  <desc id="desc">Seven kinds of numbers go into one plant file: products and demand, run rates, prices and unit costs, switching costs, cost of stock and lost sales, stock views, and run length and starting stock. The file my-plant.twin.yaml has three sections: model, snapshot and experiment. The check, run and race commands all read that file.</desc>
  <style>
    .bg { fill: #f6f8fb; stroke: #dfe3e8; stroke-width: 1; }
    .card { fill: #ffffff; stroke: #c7d6e8; stroke-width: 1.5; }
    .tint { fill: #eef4ff; stroke: #9cc2ff; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0073fe; stroke-width: 2; }
    .later { fill: #ffffff; stroke: #8fa6c4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .warn { fill: #fdf1e4; stroke: #f68d2e; stroke-width: 1.5; }
    .h { font-family: 'Space Grotesk', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #002550; letter-spacing: -0.3px; }
    .sub { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #54585c; }
    .t { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #002550; }
    .b { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #243042; }
    .m { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #54585c; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; fill: #003b82; }
    .num { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; fill: #243042; }
    .good { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0055bc; }
    .bad { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #8a4c11; }
    .line { stroke: #0055bc; stroke-width: 1.5; fill: none; }
    .tree { stroke: #8fa6c4; stroke-width: 1.5; fill: none; }
    .axis { stroke: #8fa6c4; stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0055bc"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="799" height="457" rx="4"/>

  <text class="h" x="36" y="44">How your numbers flow into the plant file</text>
  <text class="sub" x="36" y="66">You type the numbers once, into one file. Every command reads that same file.</text>
  <text class="m" x="36" y="100">Your numbers</text>
  <text class="m" x="288" y="100">The plant file (the capsule)</text>
  <text class="m" x="574" y="100">What reads it</text>

  <rect class="card" x="36" y="112" width="210" height="36" rx="4"/>
  <text class="b" x="50" y="135">Products and demand</text>
  <path class="line" d="M246 130 C268 130 264 205 286 205"/>
  <rect class="card" x="36" y="158" width="210" height="36" rx="4"/>
  <text class="b" x="50" y="181">Run rates</text>
  <path class="line" d="M246 176 C268 176 264 205 286 205"/>
  <rect class="card" x="36" y="204" width="210" height="36" rx="4"/>
  <text class="b" x="50" y="227">Prices and unit costs</text>
  <path class="line" d="M246 222 C268 222 264 205 286 205"/>
  <rect class="card" x="36" y="250" width="210" height="36" rx="4"/>
  <text class="b" x="50" y="273">Switching costs</text>
  <path class="line" d="M246 268 C268 268 264 205 286 205" marker-end="url(#arrow)"/>
  <rect class="card" x="36" y="296" width="210" height="36" rx="4"/>
  <text class="b" x="50" y="319">Cost of stock and lost sales</text>
  <path class="line" d="M246 314 C268 314 264 205 286 205"/>
  <rect class="card" x="36" y="342" width="210" height="36" rx="4"/>
  <text class="b" x="50" y="365">Stock views</text>
  <path class="line" d="M246 360 C268 360 264 205 286 205"/>
  <rect class="card" x="36" y="388" width="210" height="36" rx="4"/>
  <text class="b" x="50" y="411">Run length and starting stock</text>
  <path class="line" d="M246 406 C268 406 264 205 286 205"/>
  <rect class="pick" x="288" y="112" width="244" height="322" rx="4"/>
  <text class="code" x="302" y="138" style="font-size: 13px; font-weight: 700">my-plant.twin.yaml</text>

  <rect class="card" x="302" y="152" width="216" height="100" rx="4"/>
  <text class="code" x="316" y="176">model:</text>
  <text class="b" x="316" y="198">The plant: products,</text>
  <text class="b" x="316" y="216">switching costs, money rules,</text>
  <text class="b" x="316" y="234">views and run length.</text>

  <rect class="card" x="302" y="262" width="216" height="76" rx="4"/>
  <text class="code" x="316" y="286">snapshot:</text>
  <text class="b" x="316" y="308">A name, and the date the</text>
  <text class="b" x="316" y="326">starting stock is known.</text>

  <rect class="card" x="302" y="348" width="216" height="76" rx="4"/>
  <text class="code" x="316" y="372">experiment:</text>
  <text class="b" x="316" y="394">Run settings: the number of</text>
  <text class="b" x="316" y="412">runs and the random seed.</text>

  <path class="line" d="M532 268 C556 268 552 164 572 164" marker-end="url(#arrow)"/>
  <rect class="card" x="574" y="132" width="190" height="64" rx="4"/>
  <text class="t" x="588" y="158">Check it</text>
  <text class="code" x="588" y="179" style="font-size: 11px">twinflow extensions check</text>
  <path class="line" d="M532 268 C556 268 552 264 572 264" marker-end="url(#arrow)"/>
  <rect class="card" x="574" y="232" width="190" height="64" rx="4"/>
  <text class="t" x="588" y="258">Run it</text>
  <text class="code" x="588" y="279" style="font-size: 11px">twinflow scenario run</text>
  <path class="line" d="M532 268 C556 268 552 364 572 364" marker-end="url(#arrow)"/>
  <rect class="card" x="574" y="332" width="190" height="64" rx="4"/>
  <text class="t" x="588" y="358">Race rules on it</text>
  <text class="code" x="588" y="379" style="font-size: 11px">twinflow policies race</text>
</svg>
