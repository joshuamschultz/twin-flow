<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="title desc">
  <title id="title">From model to one change</title>
  <desc id="desc">A path in six steps. 1 Model your floor. 2 Add people and shifts. 3 Add jobs. 4 See today, the baseline, 79.7 percent on time. 5 Test a bad day, with four cases: down machine, missing person, rush order and order surge. 6 Pick a change: add a worker or machine, add a Saturday shift, or let the twin optimize.</desc>
  <style>
    .bg { fill: #f6f8fb; stroke: #dfe3e8; stroke-width: 1; }
    .card { fill: #ffffff; stroke: #c7d6e8; stroke-width: 1.5; }
    .tint { fill: #eef4ff; stroke: #9cc2ff; stroke-width: 1.5; }
    .pick { fill: #eef4ff; stroke: #0073fe; stroke-width: 2; }
    .later { fill: #ffffff; stroke: #8fa6c4; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .warn { fill: #f68d2e; fill-opacity: 0.1; stroke: #f68d2e; stroke-width: 1.5; }
    .h { font-family: 'Space Grotesk', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #002550; letter-spacing: -0.3px; }
    .sub { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #54585c; }
    .t { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #002550; }
    .b { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #243042; }
    .m { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #54585c; }
    .code { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; fill: #003b82; }
    .num { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; fill: #243042; }
    .good { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0055bc; }
    .bad { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #8a4c11; }
    .line { stroke: #0055bc; stroke-width: 1.5; fill: none; }
    .tree { stroke: #8fa6c4; stroke-width: 1.5; fill: none; }
    .axis { stroke: #8fa6c4; stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0055bc"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="799" height="399" rx="4"/>

  <text class="h" x="36" y="44">From model to one change</text>
  <text class="sub" x="36" y="66">Build the shop, measure today, test the bad days, then pick one change.</text>
  <rect class="card" x="36" y="92" width="164" height="72" rx="4"/>
  <circle cx="58" cy="116" r="11" fill="#0073fe"/>
  <text x="58" y="120.5" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text class="t" x="74" y="121" style="font-size: 13px">Model the floor</text>
  <text class="m" x="52" y="148">Machines, steps, times</text>
  <path class="line" d="M200 128 H222" marker-end="url(#arrow)"/>
  <rect class="card" x="224" y="92" width="164" height="72" rx="4"/>
  <circle cx="246" cy="116" r="11" fill="#0073fe"/>
  <text x="246" y="120.5" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text class="t" x="262" y="121" style="font-size: 13px">People and shifts</text>
  <text class="m" x="240" y="148">Who works, and when</text>
  <path class="line" d="M388 128 H410" marker-end="url(#arrow)"/>
  <rect class="card" x="412" y="92" width="164" height="72" rx="4"/>
  <circle cx="434" cy="116" r="11" fill="#0073fe"/>
  <text x="434" y="120.5" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text class="t" x="450" y="121" style="font-size: 13px">Jobs</text>
  <text class="m" x="428" y="148">The orders file</text>
  <path class="line" d="M576 128 H598" marker-end="url(#arrow)"/>
  <rect class="pick" x="600" y="92" width="164" height="72" rx="4"/>
  <circle cx="622" cy="116" r="11" fill="#0073fe"/>
  <text x="622" y="120.5" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text class="t" x="638" y="121" style="font-size: 13px">See today</text>
  <text class="m" x="616" y="148">79.7% on time</text>
  <text class="m" x="692" y="208" style="font-size: 11.5px">The baseline</text>
  <path class="line" d="M682 164 V240" marker-end="url(#arrow)" transform="translate(0,0)"/>
  <rect class="warn" x="600" y="240" width="164" height="56" rx="4"/>
  <circle cx="622" cy="268" r="11" fill="#0073fe"/>
  <text x="622" y="272.5" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text class="t" x="640" y="273" style="font-size: 13px">Test a bad day</text>
  <rect class="card" x="330" y="196" width="190" height="28" rx="2"/>
  <text class="b" x="346" y="215">Down machine</text>
  <path class="line" d="M600 268 C562 268 562 210 522 210" marker-end="url(#arrow)"/>
  <rect class="card" x="330" y="234" width="190" height="28" rx="2"/>
  <text class="b" x="346" y="253">Missing person</text>
  <path class="line" d="M600 268 C562 268 562 248 522 248" marker-end="url(#arrow)"/>
  <rect class="card" x="330" y="272" width="190" height="28" rx="2"/>
  <text class="b" x="346" y="291">Rush order</text>
  <path class="line" d="M600 268 C562 268 562 286 522 286" marker-end="url(#arrow)"/>
  <rect class="card" x="330" y="310" width="190" height="28" rx="2"/>
  <text class="b" x="346" y="329">Order surge</text>
  <path class="line" d="M600 268 C562 268 562 324 522 324" marker-end="url(#arrow)"/>
  <path class="line" d="M330 210 C282 210 282 236 228 236" marker-end="url(#arrow)"/>
  <path class="line" d="M330 248 C282 248 282 258 228 258" marker-end="url(#arrow)"/>
  <path class="line" d="M330 286 C282 286 282 278 228 278" marker-end="url(#arrow)"/>
  <path class="line" d="M330 324 C282 324 282 300 228 300" marker-end="url(#arrow)"/>
  <rect class="pick" x="36" y="196" width="190" height="142" rx="4"/>
  <circle cx="58" cy="224" r="11" fill="#0073fe"/>
  <text x="58" y="228.5" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">6</text>
  <text class="t" x="76" y="229" style="font-size: 13px">Pick a change</text>
  <circle cx="54" cy="256" r="2.5" fill="#0055bc"/>
  <text class="b" x="66" y="260" style="font-size: 12.5px">Add a worker or machine</text>
  <circle cx="54" cy="284" r="2.5" fill="#0055bc"/>
  <text class="b" x="66" y="288" style="font-size: 12.5px">Add a Saturday shift</text>
  <circle cx="54" cy="312" r="2.5" fill="#0055bc"/>
  <text class="b" x="66" y="316" style="font-size: 12.5px">Let the twin optimize</text>
  <text class="m" x="36" y="378">Then run the same check again. Change one thing, and compare it to today.</text>
</svg>
