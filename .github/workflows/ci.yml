name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # numpy 2.x stubs need mypy target >=3.12; runtime floor is 3.11
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Every gate FAILS the build on any finding.
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy --strict src
      - name: Tests
        run: pytest
      - name: Dependency audit (simpleeval CVE gate)
        run: pip-audit
