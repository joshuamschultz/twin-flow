# Scenario capsule for the hmlv-calendar example. Import this file in the workspace UI,
# or run: twinflow scenario run examples/hmlv-calendar/hmlv-calendar.twin.yaml --seed 42
schema_version: '0.1'
model:
  stocks: []
  part_types:
  - name: raw
    uom: piece
    attributes: {}
  - name: finished
    uom: piece
    attributes: {}
  machines:
  - name: mill
  labor:
    pools:
    - name: machinists
      headcount: 2
      skills:
      - mill
      calendar:
        timezone: America/Chicago
        origin: '2026-03-02T07:00:00-06:00'
        weekly:
        - days:
          - mon
          - tue
          - wed
          - thu
          - fri
          start: 07:00
          end: '15:30'
        exceptions:
        - date: '2026-03-09'
          closed: true
  locations:
  - name: mill
    consumes:
    - thing: raw
      qty: 1
      uom: piece
    emits:
    - thing: finished
      qty: 1
      uom: piece
    setup_key: finished-family
    changeover_seconds: 600
    capacity: 2
    time_model:
      kind: rate_based
      rate: 0.0002777777777777778
    machine: mill
    labor_skill: mill
    shift_crossing: pause
  routing:
  - part: finished
    steps:
    - mill
  processes: []
  bom: []
snapshot:
  id: hmlv-calendar-example
  as_of: '2026-09-12T00:00:00+00:00'
  model_revision: legacy
  production_plan:
  - work_order_id: A
    part: finished
    qty: 1
    start_date: '0'
    due_date: '86400'
    initial_wip_location: null
    initial_wip_qty: null
    initial_wip_remaining_time: null
    priority: 0
    completed_good_qty: 0
  - work_order_id: B
    part: finished
    qty: 1
    start_date: '0'
    due_date: '86400'
    initial_wip_location: null
    initial_wip_qty: null
    initial_wip_remaining_time: null
    priority: 0
    completed_good_qty: 0
experiment:
  id: hmlv-calendar-example
  replications: 1
  seed: 0
assumptions:
  source: legacy model + plan
provenance:
  model: examples/hmlv-calendar/model.yaml
  plan: examples/hmlv-calendar/plan.csv
  migration: legacy-pair-to-capsule-v0.1
required_capabilities:
- manufacturing.basic
