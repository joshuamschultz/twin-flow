# Scenario capsule for the tier0-foundry example. Import this file in the workspace UI,
# or run: twinflow scenario run examples/tier0-foundry/tier0-foundry.twin.yaml --seed 42
schema_version: '0.1'
model:
  stocks:
  - name: ingot
    uom: piece
  - name: sand
    uom: kg
    initial: 0
    reorder_point: 20
    refill_to: 200
  part_types:
  - name: ingot
    uom: piece
    attributes: {}
  - name: molten
    uom: piece
    attributes: {}
  - name: casting
    uom: piece
    attributes: {}
  - name: annealed
    uom: piece
    attributes: {}
  - name: part
    uom: piece
    attributes: {}
  - name: part_scrap
    uom: piece
    attributes: {}
  machines:
  - name: melt_m
  - name: mold_m
  - name: anneal_m
  - name: inspect_m
  - name: scrap_m
  labor:
    pools:
    - name: floor_pool
      headcount: 4
      skills:
      - furnace
      - finish
  locations:
  - name: melt
    consumes:
    - thing: ingot
      qty: 1
      uom: piece
    emits:
    - thing: molten
      qty: 1
      uom: piece
    setup_key: grp_melt
    changeover_seconds: 120
    time_model:
      kind: rate_based
      rate: 0.5
    machine: melt_m
    labor_skill: furnace
  - name: mold
    consumes:
    - thing: molten
      qty: 1
      uom: piece
    emits:
    - thing: casting
      qty: 1
      uom: piece
    setup_key: grp_mold
    material:
      stock: sand
      qty: 3
      uom: kg
    time_model:
      kind: rate_based
      rate: 0.5
    machine: mold_m
    labor_skill: furnace
  - name: anneal
    consumes:
    - thing: casting
      qty: 1
      uom: piece
    emits:
    - thing: annealed
      qty: 1
      uom: piece
    setup_key: grp_anneal
    batch_size: 5 piece
    time_model:
      kind: batch_hold
      seconds: 400
    machine: anneal_m
    labor_skill: finish
  - name: inspect
    consumes:
    - thing: annealed
      qty: 1
      uom: piece
    emits:
    - thing: part
      qty: 1
      uom: piece
    setup_key: grp_inspect
    time_model:
      kind: rate_based
      rate: 1.0
    machine: inspect_m
    labor_skill: finish
    quality_gate:
      thing: part
      branches:
      - prob: 0.9
        to: null
      - prob: 0.1
        to: scrap_bin
  - name: scrap_bin
    consumes:
    - thing: part
      qty: 1
      uom: piece
    emits:
    - thing: part_scrap
      qty: 1
      uom: piece
    setup_key: grp_scrap
    time_model:
      kind: rate_based
      rate: 2.0
    machine: scrap_m
    labor_skill: finish
  routing:
  - part: part
    steps:
    - melt
    - mold
    - anneal
    - inspect
  processes: []
  bom: []
