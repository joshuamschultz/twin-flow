  - name: divide_blueberry
    consumes: [{thing: folded_blueberry, qty: 1, uom: loaf}]
    emits: [{thing: divided_blueberry, qty: 1, uom: loaf}]
    setup_key: grp_bench
    split_output: true
    time_model: {kind: rate_based, rate: 0.008333}
    machine: bench_m
    labor_skill: bake
