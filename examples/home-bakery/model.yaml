  # 5. SHAPE -- pre-shape, bench rest, final shape, into the banneton, PER LOAF now.
  #    One work surface (`bench_m`, capacity 1) shared with divide and lamination, so
  #    all bench work is strictly serial -- the busiest hands-on stretch of the day.
  #    Runs earliest-due-date first.
  - name: shape_blueberry
    consumes: [{thing: divided_blueberry, qty: 1, uom: loaf}]
    emits: [{thing: shaped_blueberry, qty: 1, uom: loaf}]
    setup_key: grp_bench
    dispatch: edd
    time_model: {kind: rate_based, rate: 0.002381}
    machine: bench_m
    labor_skill: bake
    shift_crossing: pause
  # 6. COLD RETARD -- 14 h in the fridge, PER LOAF. THE LEVER: `fridge_m` capacity is
  #    counted in bannetons, and every loaf here is its own banneton. Loaf 25 on a
  #    24-slot fridge waits for a slot to free, which is what pushes a late drop.
  - name: retard_blueberry
    consumes: [{thing: shaped_blueberry, qty: 1, uom: loaf}]
    emits: [{thing: proofed_blueberry, qty: 1, uom: loaf}]
    setup_key: grp_fridge
    capacity: 24
    time_model: {kind: batch_hold, seconds: 50400, load: 45, unload: 45}
    machine: fridge_m
    labor_skill: bake
    shift_crossing: finish_unattended
  # 7. BAKE -- THE OTHER LEVER, PER LOAF. Two ovens x two loaves = FOUR loaves baking
  #    at once, so `capacity: 4`. Each loaf is its own 55-minute hold; the oven groups
  #    four INDIVIDUAL loaves by capacity rather than merging them into one lot, so
  #    per-loaf, per-order identity is preserved. 120 s changeover is the recovery
  #    between loads; the bake itself is unattended.
  #    QUALITY GATE -- the wettest dough. 5% of loaves come out flat and go to the
  #    bin instead of the rack, so the order finishes short. A gate sends a whole
  #    loaf down one branch; it is not a fractional scrap rate.
  - name: bake_blueberry
    consumes: [{thing: proofed_blueberry, qty: 1, uom: loaf}]
    emits: [{thing: baked_blueberry, qty: 1, uom: loaf}]
    setup_key: grp_oven
    capacity: 4
    changeover_seconds: 120
    dispatch: edd
    time_model: {kind: batch_hold, seconds: 3300, load: 300, unload: 180}
    machine: oven_m
    labor_skill: bake
    shift_crossing: finish_unattended
    quality_gate:
      thing: baked_blueberry
      branches:
        - {prob: 0.95, to: coolpack_blueberry}
        - {prob: 0.05, to: flat_loaf_bin}
  # 8. COOL + BAG -- 2 h on the rack (unattended), then bag and label as the
  #    `unload`, PER LOAF. `rack_m` capacity is 12 loaves of rack space.
  - name: coolpack_blueberry
    consumes: [{thing: baked_blueberry, qty: 1, uom: loaf}]
    emits: [{thing: blueberry, qty: 1, uom: loaf}]
    setup_key: grp_rack
    capacity: 12
    time_model: {kind: batch_hold, seconds: 7200, load: 60, unload: 300}
    machine: rack_m
    labor_skill: bake
    shift_crossing: finish_unattended
  # Reached ONLY through the blueberry quality gate's fail branch, never from the
  # routing. Flat loaves are logged and binned; the order simply finishes short.
  - name: flat_loaf_bin
    consumes: [{thing: baked_blueberry, qty: 1, uom: loaf}]
    emits: [{thing: bakery_scrap, qty: 1, uom: loaf}]
    setup_key: grp_flat_loaf
    time_model: {kind: rate_based, rate: 0.016667}
    machine: scrap_m
    labor_skill: bake
    shift_crossing: pause

routing:
  - {part: plain, steps: [scale_plain, mix_plain, bulk_plain, divide_plain, shape_plain, retard_plain, bake_plain, coolpack_plain]}
  - {part: pumpkin, steps: [scale_pumpkin, mix_pumpkin, bulk_pumpkin, inclusion_pumpkin, divide_pumpkin, shape_pumpkin, retard_pumpkin, bake_pumpkin, coolpack_pumpkin]}
  - {part: blueberry, steps: [scale_blueberry, mix_blueberry, bulk_blueberry, inclusion_blueberry, divide_blueberry, shape_blueberry, retard_blueberry, bake_blueberry, coolpack_blueberry]}

processes: []
bom: []
