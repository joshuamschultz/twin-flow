# Scenario capsule for the cnc-shop example. Import this file in the workspace UI,
# or run: twinflow scenario run examples/cnc-shop/cnc-shop.twin.yaml --seed 42
schema_version: '0.1'
model:
  defaults:
    cycle_time_cv: 0.2
  stocks:
  - name: round_bar
    uom: ft
  - name: square_billet
    uom: piece
  part_types:
  - name: round_bar
    uom: ft
    attributes: {}
  - name: square_billet
    uom: piece
    attributes: {}
  - name: shaft_blank
    uom: piece
    attributes: {}
  - name: shaft_milled
    uom: piece
    attributes: {}
  - name: shaft_deburred
    uom: piece
    attributes: {}
  - name: shaft
    uom: piece
    attributes: {}
  - name: shaft_scrap
    uom: piece
    attributes: {}
  - name: bracket_blank
    uom: piece
    attributes: {}
  - name: bracket_milled
    uom: piece
    attributes: {}
  - name: bracket_deburred
    uom: piece
    attributes: {}
  - name: bracket
    uom: piece
    attributes: {}
  - name: bracket_scrap
    uom: piece
    attributes: {}
  machines:
  - name: saw_shaft_m
  - name: mill_shaft_m
  - name: deburr_shaft_m
  - name: inspect_shaft_m
  - name: saw_bracket_m
  - name: mill_bracket_m
  - name: deburr_bracket_m
  - name: inspect_bracket_m
  labor:
    pools:
    - name: floor_pool
      headcount: 6
      skills:
      - machinist
      - inspector
  locations:
  - name: saw_shaft
    consumes:
    - thing: round_bar
      qty: 1
      uom: ft
    emits:
    - thing: shaft_blank
      qty: 4
      uom: piece
    setup_key: grp_saw_shaft
    time_model:
      kind: rate_based
      rate: 0.5
    machine: saw_shaft_m
    labor_skill: machinist
  - name: mill_shaft
    consumes:
    - thing: shaft_blank
      qty: 1
      uom: piece
    emits:
    - thing: shaft_milled
      qty: 1
      uom: piece
    setup_key: grp_mill_shaft
    time_model:
      kind: rate_based
      rate: 0.03
    machine: mill_shaft_m
    labor_skill: machinist
  - name: deburr_shaft
    consumes:
    - thing: shaft_milled
      qty: 1
      uom: piece
    emits:
    - thing: shaft_deburred
      qty: 1
      uom: piece
    setup_key: grp_deburr_shaft
    time_model:
      kind: rate_based
      rate: 2.0
    machine: deburr_shaft_m
    labor_skill: inspector
  - name: inspect_shaft
    consumes:
    - thing: shaft_deburred
      qty: 1
      uom: piece
    emits:
    - thing: shaft
      uom: piece
    scrap:
      rate: 0.03
      thing: shaft_scrap
      uom: piece
    setup_key: grp_inspect_shaft
    time_model:
      kind: rate_based
      rate: 2.0
    machine: inspect_shaft_m
    labor_skill: inspector
  - name: saw_bracket
    consumes:
    - thing: square_billet
      qty: 1
      uom: piece
    emits:
    - thing: bracket_blank
      qty: 1
      uom: piece
    setup_key: grp_saw_bracket
    time_model:
      kind: rate_based
      rate: 2.0
    machine: saw_bracket_m
    labor_skill: machinist
  - name: mill_bracket
    consumes:
    - thing: bracket_blank
      qty: 1
      uom: piece
    emits:
    - thing: bracket_milled
      qty: 1
      uom: piece
    setup_key: grp_mill_bracket
    time_model:
      kind: rate_based
      rate: 0.03
    machine: mill_bracket_m
    labor_skill: machinist
  - name: deburr_bracket
    consumes:
    - thing: bracket_milled
      qty: 1
      uom: piece
    emits:
    - thing: bracket_deburred
      qty: 1
      uom: piece
    setup_key: grp_deburr_bracket
    time_model:
      kind: rate_based
      rate: 2.0
    machine: deburr_bracket_m
    labor_skill: inspector
  - name: inspect_bracket
    consumes:
    - thing: bracket_deburred
      qty: 1
      uom: piece
    emits:
    - thing: bracket
      uom: piece
    scrap:
      rate: 0.05
      thing: bracket_scrap
      uom: piece
    setup_key: grp_inspect_bracket
    time_model:
      kind: rate_based
      rate: 2.0
    machine: inspect_bracket_m
    labor_skill: inspector
  routing:
  - part: shaft
    steps:
    - saw_shaft
    - mill_shaft
    - deburr_shaft
    - inspect_shaft
  - part: bracket
    steps:
    - saw_bracket
    - mill_bracket
    - deburr_bracket
    - inspect_bracket
  processes: []
  bom: []
