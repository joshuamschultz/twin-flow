# Ridgeline Precision: the shop file.
# It lists the machines, the people and their shifts, the steps each part goes through
# (the routings), the cycle times and setup times, and what each part sells for.
# Times are in seconds. A rate is pieces per second: 0.0003704 is one piece every 45 minutes.
# `load` is the setup time for each job (fixtures, tools, first-piece check).

defaults:
  cycle_time_cv: 0.15        # real cycle times wander about 15% from the standard

stocks: []                   # raw bar, block and plate are always on the rack

part_types:
  - {name: steel_bar, uom: piece, attributes: {}}
  - {name: aluminum_block, uom: piece, attributes: {}}
  - {name: steel_plate, uom: piece, attributes: {}}
  - {name: FTG-2201_cut, uom: piece, attributes: {}}
  - {name: FTG-2201_turned, uom: piece, attributes: {}}
  - {name: FTG-2201, uom: piece, attributes: {}}        # hydraulic fitting
  - {name: VB-3107_cut, uom: piece, attributes: {}}
  - {name: VB-3107_milled, uom: piece, attributes: {}}
  - {name: VB-3107_deburred, uom: piece, attributes: {}}
  - {name: VB-3107, uom: piece, attributes: {}}         # valve body
  - {name: MB-4410_cut, uom: piece, attributes: {}}
  - {name: MB-4410_milled, uom: piece, attributes: {}}
  - {name: MB-4410, uom: piece, attributes: {}}         # mounting bracket
  - {name: scrap, uom: piece, attributes: {}}

machines:                    # one of each; steps that name the same machine share it
  - {name: band_saw}
  - {name: lathe}            # Okuma 2-axis lathe
  - {name: mill_valve}       # Haas VF-2 mill for valve bodies: the machine everyone waits for
  - {name: mill_bracket}     # older Fadal mill for brackets
  - {name: deburr_bench}
  - {name: cmm}              # inspection

labor:
  pools:
    - name: machinists       # run the saw, the lathe and the mill
      headcount: 2           # <- people on each shift. Try 3.
      skills: [saw, lathe, mill]
      calendar:
        timezone: America/Chicago
        origin: "2026-11-16T06:00:00-06:00"   # Monday 6 am: time zero of the order book
        weekly:
          - {days: [mon, tue, wed, thu, fri], start: "06:00", end: "22:00"}   # two 8-hour shifts
        exceptions:
          - {date: "2026-11-26", closed: true}   # Thanksgiving
          - {date: "2026-11-27", closed: true}   # day after Thanksgiving
    - name: inspectors       # deburr and inspect
      headcount: 1
      skills: [deburr, inspect]
      calendar:
        timezone: America/Chicago
        origin: "2026-11-16T06:00:00-06:00"
        weekly:
          - {days: [mon, tue, wed, thu, fri], start: "06:00", end: "22:00"}
        exceptions:
          - {date: "2026-11-26", closed: true}
          - {date: "2026-11-27", closed: true}

locations:
  # Hydraulic fitting FTG-2201: saw -> lathe -> inspect
  - {name: saw_FTG, consumes: [{thing: steel_bar, qty: 1, uom: piece}], emits: [{thing: FTG-2201_cut, qty: 1, uom: piece}],
     setup_key: band_saw, time_model: {kind: rate_based, rate: 0.0166667, load: 600},
     machine: band_saw, labor_skill: saw, shift_crossing: pause}
  - {name: lathe_FTG, consumes: [{thing: FTG-2201_cut, qty: 1, uom: piece}], emits: [{thing: FTG-2201_turned, qty: 1, uom: piece}],
     setup_key: lathe, time_model: {kind: rate_based, rate: 0.0041667, load: 1800},
     machine: lathe, labor_skill: lathe, dispatch: edd, shift_crossing: pause}
  - {name: inspect_FTG, consumes: [{thing: FTG-2201_turned, qty: 1, uom: piece}], emits: [{thing: FTG-2201, uom: piece}],
     scrap: {rate: 0.01, thing: scrap, uom: piece},
     setup_key: cmm, time_model: {kind: rate_based, rate: 0.0166667},
     machine: cmm, labor_skill: inspect, shift_crossing: pause}

  # Valve body VB-3107: saw -> mill -> deburr -> inspect
  - {name: saw_VB, consumes: [{thing: aluminum_block, qty: 1, uom: piece}], emits: [{thing: VB-3107_cut, qty: 1, uom: piece}],
     setup_key: band_saw, time_model: {kind: rate_based, rate: 0.0111111, load: 600},
     machine: band_saw, labor_skill: saw, shift_crossing: pause}
  - {name: mill_VB, consumes: [{thing: VB-3107_cut, qty: 1, uom: piece}], emits: [{thing: VB-3107_milled, qty: 1, uom: piece}],
     setup_key: mill_valve, time_model: {kind: rate_based, rate: 0.0003704, load: 2700},
     machine: mill_valve, labor_skill: mill, dispatch: edd, shift_crossing: pause}
  - {name: deburr_VB, consumes: [{thing: VB-3107_milled, qty: 1, uom: piece}], emits: [{thing: VB-3107_deburred, qty: 1, uom: piece}],
     setup_key: deburr_bench, time_model: {kind: rate_based, rate: 0.0033333},
     machine: deburr_bench, labor_skill: deburr, shift_crossing: pause}
  - {name: inspect_VB, consumes: [{thing: VB-3107_deburred, qty: 1, uom: piece}], emits: [{thing: VB-3107, uom: piece}],
     scrap: {rate: 0.02, thing: scrap, uom: piece},
     setup_key: cmm, time_model: {kind: rate_based, rate: 0.0055556},
     machine: cmm, labor_skill: inspect, shift_crossing: pause}

  # Mounting bracket MB-4410: saw -> mill -> inspect
  - {name: saw_MB, consumes: [{thing: steel_plate, qty: 1, uom: piece}], emits: [{thing: MB-4410_cut, qty: 1, uom: piece}],
     setup_key: band_saw, time_model: {kind: rate_based, rate: 0.0166667, load: 600},
     machine: band_saw, labor_skill: saw, shift_crossing: pause}
  - {name: mill_MB, consumes: [{thing: MB-4410_cut, qty: 1, uom: piece}], emits: [{thing: MB-4410_milled, qty: 1, uom: piece}],
     setup_key: mill_bracket, time_model: {kind: rate_based, rate: 0.0013889, load: 2700},
     machine: mill_bracket, labor_skill: mill, dispatch: edd, shift_crossing: pause}
  - {name: inspect_MB, consumes: [{thing: MB-4410_milled, qty: 1, uom: piece}], emits: [{thing: MB-4410, uom: piece}],
     scrap: {rate: 0.01, thing: scrap, uom: piece},
     setup_key: cmm, time_model: {kind: rate_based, rate: 0.0166667},
     machine: cmm, labor_skill: inspect, shift_crossing: pause}

routing:                     # the order of steps for each part
  - {part: FTG-2201, steps: [saw_FTG, lathe_FTG, inspect_FTG]}
  - {part: VB-3107, steps: [saw_VB, mill_VB, deburr_VB, inspect_VB]}
  - {part: MB-4410, steps: [saw_MB, mill_MB, inspect_MB]}

processes: []
bom: []

economics:                   # money, so the state map can show where dollars go
  things:
    FTG-2201: {price: 38, unit_cost: 14, late_cost_per_day: 150}
    VB-3107: {price: 410, unit_cost: 165, late_cost_per_day: 600}
    MB-4410: {price: 72, unit_cost: 27, late_cost_per_day: 250}
  setup: {cost: 90}
