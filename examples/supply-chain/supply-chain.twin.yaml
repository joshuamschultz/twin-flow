# Scenario capsule for the supply-chain example. Import this file in the workspace UI,
# or run: twinflow scenario run examples/supply-chain/supply-chain.twin.yaml --seed 42
schema_version: '0.1'
model:
  defaults:
    cycle_time_cv: 0.15
  stocks:
  - name: bulk_resin
    uom: kg
    initial: 500
    reorder_point: 180
    refill_to: 800
    lead_time: 4000
  - name: resin
    uom: kg
    initial: 300
    reorder_point: 130
    refill_to: 450
    lead_time: 1200
    supplier: bulk_resin
  part_types:
  - name: raw_blank
    uom: piece
    attributes: {}
  - name: part
    uom: piece
    attributes: {}
  - name: resin
    uom: kg
    attributes: {}
  - name: bulk_resin
    uom: kg
    attributes: {}
  machines:
  - name: mold_m
  labor:
    pools:
    - name: floor_pool
      headcount: 3
      skills:
      - molder
  locations:
  - name: mold
    consumes:
    - thing: raw_blank
      qty: 1
      uom: piece
    emits:
    - thing: part
      qty: 1
      uom: piece
    material:
      stock: resin
      qty: 15
      uom: kg
    setup_key: grp_mold
    time_model:
      kind: rate_based
      rate: 0.05
    machine: mold_m
    labor_skill: molder
  routing:
  - part: part
    steps:
    - mold
  processes: []
  bom: []
