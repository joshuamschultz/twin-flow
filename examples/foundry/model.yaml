# FOUNDRY worked example — a sand-casting floor as pure config, no Python.
#
# Two parallel casting lines share one raw metal feedstock and one recycle
# loop, each line otherwise a single-station-per-step chain:
#
#   metal_ingot -> melt -> pour (continuous-to-discrete: lb -> piece castings)
#                -> clean (splits into good + scrap) -> machine -> finished
#
#   Line A: melt_a -> pour_a -> clean_a -> machine_a  =>  bracket
#   Line B: melt_b -> pour_b -> clean_b -> machine_b  =>  flywheel
#
# THE REMELT LOOP: `clean_a`/`clean_b` both scrap a fraction of the castings
# they clean. That scrap is routed back to a shared, NAMED top-level stock
# (`output_stocks: {remelt: remelt}`) instead of a dead-end sink -- the
# general "route an output back to a Stock" capability, not a foundry-only
# special case (D-044). Per the stock-identity rule (`Stock.put()` checks the
# bundle's `thing` against the stock's own `name`), the routed thing and the
# declared stock share the literal name `remelt`.
#
# Kept intentionally boring per scope: one station per step, no parallel
# stations, no quality gates, no batch cooling -- those are later phases of
# the multi-station-foundry feature, not needed for this worked example.

stocks:
  - name: metal_ingot
    uom: lb
  - name: remelt
    uom: piece

part_types:
  - name: metal_ingot
    uom: lb
    attributes: {}
  - name: remelt
    uom: piece
    attributes: {}
  # Line A -- bracket
  - name: molten_bracket
    uom: lb
    attributes: {}
  - name: bracket_casting
    uom: piece
    attributes: {}
  - name: bracket_clean
    uom: piece
    attributes: {}
  - name: bracket
    uom: piece
    attributes: {}
  # Line B -- flywheel
  - name: molten_flywheel
    uom: lb
    attributes: {}
  - name: flywheel_casting
    uom: piece
    attributes: {}
  - name: flywheel_clean
    uom: piece
    attributes: {}
  - name: flywheel
    uom: piece
    attributes: {}

machines:
  - name: melt_a_m
  - name: pour_a_m
  - name: clean_a_m
  - name: machine_a_m
  - name: melt_b_m
  - name: pour_b_m
  - name: clean_b_m
  - name: machine_b_m

labor:
  pools:
    - name: floor_pool
      headcount: 6
      skills: [melt_op, pour_op, clean_op, machine_op]

locations:
  # ---------------------------------------------------------------- Line A --
  - name: melt_a
    consumes:
      - thing: metal_ingot
        qty: 1
        uom: lb
    emits:
      - thing: molten_bracket
        qty: 1
        uom: lb
    batch_size: "40 lb"
    setup_key: grp_melt_a
    time_model:
      kind: rate_based
      rate: 10
    machine: melt_a_m
    labor_skill: melt_op

  # Continuous-to-discrete: 1 lb of molten metal (the basis) pours into 3
  # bracket castings, same "ordinary emits ratio against the basis" pattern
  # `examples/spring/model.yaml`'s `cut` step already uses for wire -> blank.
  - name: pour_a
    consumes:
      - thing: molten_bracket
        qty: 1
        uom: lb
    emits:
      - thing: bracket_casting
        qty: 3
        uom: piece
    setup_key: grp_pour_a
    time_model:
      kind: rate_based
      rate: 6
    machine: pour_a_m
    labor_skill: pour_op

  # Cleaning scraps 8% of castings; the scrap is routed to the shared
  # `remelt` stock instead of a dead-end sink -- the recycle loop.
  - name: clean_a
    consumes:
      - thing: bracket_casting
        qty: 1
        uom: piece
    emits:
      - thing: bracket_clean
        uom: piece
    scrap:
      rate: 0.08
      thing: remelt
      uom: piece
    output_stocks:
      remelt: remelt
    setup_key: grp_clean_a
    time_model:
      kind: rate_based
      rate: 12
    machine: clean_a_m
    labor_skill: clean_op

  - name: machine_a
    consumes:
      - thing: bracket_clean
        qty: 1
        uom: piece
    emits:
      - thing: bracket
        qty: 1
        uom: piece
    setup_key: grp_machine_a
    time_model:
      kind: rate_based
      rate: 8
    machine: machine_a_m
    labor_skill: machine_op

  # ---------------------------------------------------------------- Line B --
  - name: melt_b
    consumes:
      - thing: metal_ingot
        qty: 1
        uom: lb
    emits:
      - thing: molten_flywheel
        qty: 1
        uom: lb
    batch_size: "60 lb"
    setup_key: grp_melt_b
    time_model:
      kind: rate_based
      rate: 9
    machine: melt_b_m
    labor_skill: melt_op

  - name: pour_b
    consumes:
      - thing: molten_flywheel
        qty: 1
        uom: lb
    emits:
      - thing: flywheel_casting
        qty: 2
        uom: piece
    setup_key: grp_pour_b
    time_model:
      kind: rate_based
      rate: 5
    machine: pour_b_m
    labor_skill: pour_op

  # Cleaning scraps 12% of castings -- also routed to the shared `remelt`
  # stock, proving the recycle loop is general, not a per-line special case.
  - name: clean_b
    consumes:
      - thing: flywheel_casting
        qty: 1
        uom: piece
    emits:
      - thing: flywheel_clean
        uom: piece
    scrap:
      rate: 0.12
      thing: remelt
      uom: piece
    output_stocks:
      remelt: remelt
    setup_key: grp_clean_b
    time_model:
      kind: rate_based
      rate: 10
    machine: clean_b_m
    labor_skill: clean_op

  - name: machine_b
    consumes:
      - thing: flywheel_clean
        qty: 1
        uom: piece
    emits:
      - thing: flywheel
        qty: 1
        uom: piece
    setup_key: grp_machine_b
    time_model:
      kind: rate_based
      rate: 6
    machine: machine_b_m
    labor_skill: machine_op

routing:
  - part: bracket
    steps: [melt_a, pour_a, clean_a, machine_a]
  - part: flywheel
    steps: [melt_b, pour_b, clean_b, machine_b]

processes: []
bom: []
