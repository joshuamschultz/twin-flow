# Scenario capsule for the active-control example. Import this file in the workspace UI,
# or run: twinflow scenario run examples/active-control/active-control.twin.yaml --seed 42
schema_version: '0.1'
model:
  defaults:
    cycle_time_cv: 0.15
  release:
    policy: wip_cap
    wip_cap: 5
  machines:
  - name: press_m
  - name: pack_m
  part_types:
  - name: steel
    uom: piece
    attributes: {}
  - name: pressed
    uom: piece
    attributes: {}
  - name: part
    uom: piece
    attributes: {}
  stocks: []
  labor:
    pools:
    - name: floor
      headcount: 2
      skills:
      - press_op
      - pack_op
  locations:
  - name: press
    consumes:
    - thing: steel
      qty: 1
      uom: piece
    emits:
    - thing: pressed
      qty: 1
      uom: piece
    setup_key: g_press
    dispatch: edd
    breakdown:
      mtbf: 20m
      mttr:
        dist: lognormal
        mean: 5m
        cv: 0.4
    time_model:
      kind: rate_based
      rate: 0.02
    machine: press_m
    labor_skill: press_op
  - name: pack
    consumes:
    - thing: pressed
      qty: 1
      uom: piece
    emits:
    - thing: part
      qty: 1
      uom: piece
    setup_key: g_pack
    time_model:
      kind: rate_based
      rate: 0.1
    machine: pack_m
    labor_skill: pack_op
  routing:
  - part: part
    steps:
    - press
    - pack
