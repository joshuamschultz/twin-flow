# LED MANUFACTURER worked example — a made-to-order LED light maker as PURE
# CONFIG (no Python).
#
# Chain (per size variant): diffuser sheet -> CUT (continuous-to-discrete,
# mirrors examples/spring/'s wire cut) -> panel piece -> ASSEMBLE (several
# component bundles -> one light, mirrors test_compile.py's `assembler` case:
# panel + led_strip + driver + housing all feed ONE emit) -> BURN-IN (test)
# -> PACK -> finished packed light.
#
# MADE-TO-ORDER SIZING: today's plan.csv schema (work_order_id, part, qty,
# start_date, due_date) has no per-order dimension/size column, so a truly
# custom per-order light size cannot be expressed. This example models
# made-to-order sizing as three discrete SIZE VARIANTS (small/medium/large),
# each its own finished part type with its own panel/strip consumption ratio.
# See README.md for the exact schema gap and what a fix would need.

defaults:
  # Real floors are variable: every cycle time gets a +/-20% lognormal
  # spread by default, so replicated runs report a confidence range, not a
  # single fake-certain number. Any location may override with its own `cv`.
  cycle_time_cv: 0.2

stocks: []

part_types:
  # Continuous roll stock cut into discrete panels (the CUTTING signature step).
  - name: diffuser_sheet
    uom: ft
    attributes: {}
  - name: sheet_remainder
    uom: ft
    attributes: {}
  - name: panel_small
    uom: piece
    attributes: {}
  - name: panel_medium
    uom: piece
    attributes: {}
  - name: panel_large
    uom: piece
    attributes: {}

  # Purchased components that feed the ASSEMBLY signature step.
  - name: led_strip
    uom: ft
    attributes: {}
  - name: driver
    uom: piece
    attributes: {}
  - name: housing_small
    uom: piece
    attributes: {}
  - name: housing_medium
    uom: piece
    attributes: {}
  - name: housing_large
    uom: piece
    attributes: {}

  # Assembled -> burned-in -> packed, per size variant.
  - name: light_small
    uom: piece
    attributes: {}
  - name: light_medium
    uom: piece
    attributes: {}
  - name: light_large
    uom: piece
    attributes: {}
  - name: tested_light_small
    uom: piece
    attributes: {}
  - name: tested_light_medium
    uom: piece
    attributes: {}
  - name: tested_light_large
    uom: piece
    attributes: {}
  - name: packed_light_small
    uom: piece
    attributes: {}
  - name: packed_light_medium
    uom: piece
    attributes: {}
  - name: packed_light_large
    uom: piece
    attributes: {}

machines:
  - name: cut_small_m
  - name: cut_medium_m
  - name: cut_large_m
  - name: asm_small_m
  - name: asm_medium_m
  - name: asm_large_m
  - name: burnin_small_m
  - name: burnin_medium_m
  - name: burnin_large_m
  - name: pack_small_m
  - name: pack_medium_m
  - name: pack_large_m

labor:
  pools:
    # THE CONSTRAINT: one assembler covers every size's assemble_* station.
    # Machines are dedicated per size and fast (see cut/burnin/pack rates
    # below) -- there is no machine shortage anywhere in this model. The
    # single human who can run an assemble_* station is the shortage.
    - name: assembler_pool
      headcount: 1
      skills: [asm_op]
    # Ample support labor for cut/burn-in/pack -- ample on purpose, so
    # nothing but the assembler ever queues on an operator.
    - name: support_pool
      headcount: 6
      skills: [cut_op, qa_op, pack_op]

locations:
  # -------------------------------------------------------------------
  # CUT — continuous-to-discrete: 1 ft of diffuser sheet (the basis) yields
  # a size-specific panel COUNT plus a leftover-sheet REMAINDER, both plain
  # `emits` ratios against the same `consumes[0]` basis (D-043/D-044): no
  # scrap block, no hand-written emit expression. Mirrors examples/spring/'s
  # `cut` location exactly.
  # -------------------------------------------------------------------
  - name: cut_small
    consumes:
      - thing: diffuser_sheet
        qty: 1
        uom: ft
    emits:
      - thing: panel_small
        qty: 4
        uom: piece
      - thing: sheet_remainder
        qty: 0.05
        uom: ft
    setup_key: grp_cut_small
    time_model:
      kind: rate_based
      rate: 2
    machine: cut_small_m
    labor_skill: cut_op

  - name: cut_medium
    consumes:
      - thing: diffuser_sheet
        qty: 1
        uom: ft
    emits:
      - thing: panel_medium
        qty: 2
        uom: piece
      - thing: sheet_remainder
        qty: 0.08
        uom: ft
    setup_key: grp_cut_medium
    time_model:
      kind: rate_based
      rate: 1.5
    machine: cut_medium_m
    labor_skill: cut_op

  - name: cut_large
    consumes:
      - thing: diffuser_sheet
        qty: 1
        uom: ft
    emits:
      - thing: panel_large
        qty: 1
        uom: piece
      - thing: sheet_remainder
        qty: 0.1
        uom: ft
    setup_key: grp_cut_large
    time_model:
      kind: rate_based
      rate: 1.0
    machine: cut_large_m
    labor_skill: cut_op

  # -------------------------------------------------------------------
  # ASSEMBLE — the ASSEMBLY signature step: several component bundles
  # (panel + led_strip + driver + housing) feed ONE emit, mirroring
  # test_compile.py's `assembler` case (multiple consumes -> one emit).
  # `consumes[0]` (panel, the size-setting component) is the ratio basis:
  # 1 panel -> 1 light.
  # -------------------------------------------------------------------
  - name: assemble_small
    consumes:
      - thing: panel_small
        qty: 1
        uom: piece
      - thing: led_strip
        qty: 2
        uom: ft
      - thing: driver
        qty: 1
        uom: piece
      - thing: housing_small
        qty: 1
        uom: piece
    emits:
      - thing: light_small
        qty: 1
        uom: piece
    setup_key: grp_asm_small
    # SLOW ON PURPOSE (D-034/labor-shortage tuning): assembly is the one
    # station a single assembler has to hand-build, so its rate is the
    # story of this example -- see labor.pools above and README.md.
    time_model:
      kind: rate_based
      rate: 0.02
    machine: asm_small_m
    labor_skill: asm_op

  - name: assemble_medium
    consumes:
      - thing: panel_medium
        qty: 1
        uom: piece
      - thing: led_strip
        qty: 3
        uom: ft
      - thing: driver
        qty: 1
        uom: piece
      - thing: housing_medium
        qty: 1
        uom: piece
    emits:
      - thing: light_medium
        qty: 1
        uom: piece
    setup_key: grp_asm_medium
    time_model:
      kind: rate_based
      rate: 0.015
    machine: asm_medium_m
    labor_skill: asm_op

  - name: assemble_large
    consumes:
      - thing: panel_large
        qty: 1
        uom: piece
      - thing: led_strip
        qty: 4.5
        uom: ft
      - thing: driver
        qty: 1
        uom: piece
      - thing: housing_large
        qty: 1
        uom: piece
    emits:
      - thing: light_large
        qty: 1
        uom: piece
    setup_key: grp_asm_large
    time_model:
      kind: rate_based
      rate: 0.01
    machine: asm_large_m
    labor_skill: asm_op

  # -------------------------------------------------------------------
  # BURN-IN — test/burn-in step; larger lights burn in slower.
  # -------------------------------------------------------------------
  - name: burnin_small
    consumes:
      - thing: light_small
        qty: 1
        uom: piece
    emits:
      - thing: tested_light_small
        qty: 1
        uom: piece
    setup_key: grp_burnin_small
    time_model:
      kind: rate_based
      rate: 0.5
    machine: burnin_small_m
    labor_skill: qa_op

  - name: burnin_medium
    consumes:
      - thing: light_medium
        qty: 1
        uom: piece
    emits:
      - thing: tested_light_medium
        qty: 1
        uom: piece
    setup_key: grp_burnin_medium
    time_model:
      kind: rate_based
      rate: 0.35
    machine: burnin_medium_m
    labor_skill: qa_op

  - name: burnin_large
    consumes:
      - thing: light_large
        qty: 1
        uom: piece
    emits:
      - thing: tested_light_large
        qty: 1
        uom: piece
    setup_key: grp_burnin_large
    time_model:
      kind: rate_based
      rate: 0.25
    machine: burnin_large_m
    labor_skill: qa_op

  # -------------------------------------------------------------------
  # PACK — final packaging step.
  # -------------------------------------------------------------------
  - name: pack_small
    consumes:
      - thing: tested_light_small
        qty: 1
        uom: piece
    emits:
      - thing: packed_light_small
        qty: 1
        uom: piece
    setup_key: grp_pack_small
    time_model:
      kind: rate_based
      rate: 1.2
    machine: pack_small_m
    labor_skill: pack_op

  - name: pack_medium
    consumes:
      - thing: tested_light_medium
        qty: 1
        uom: piece
    emits:
      - thing: packed_light_medium
        qty: 1
        uom: piece
    setup_key: grp_pack_medium
    time_model:
      kind: rate_based
      rate: 1.0
    machine: pack_medium_m
    labor_skill: pack_op

  - name: pack_large
    consumes:
      - thing: tested_light_large
        qty: 1
        uom: piece
    emits:
      - thing: packed_light_large
        qty: 1
        uom: piece
    setup_key: grp_pack_large
    time_model:
      kind: rate_based
      rate: 0.8
    machine: pack_large_m
    labor_skill: pack_op

routing:
  - part: packed_light_small
    steps: [cut_small, assemble_small, burnin_small, pack_small]
  - part: packed_light_medium
    steps: [cut_medium, assemble_medium, burnin_medium, pack_medium]
  - part: packed_light_large
    steps: [cut_large, assemble_large, burnin_large, pack_large]

processes: []
bom: []
